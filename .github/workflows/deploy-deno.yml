name: deploy-deno

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source
        run: |
          node scripts/deps-check.js
          node scripts/lint.js
          node scripts/i18n-check.js
          node --test

      - name: Build static assets
        run: node scripts/build.js

      - name: Deploy to Deno Deploy
        run: npx deployctl@latest deploy --project=vanilla-js-template --token "$DENO_DEPLOY_TOKEN" server/adapters/deno.entry.js
